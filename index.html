<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf4f6" />
    <title>AdX 渠道管理平台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#183142;background:#edf4f6;font-synthesis:none}
      *{box-sizing:border-box}body{margin:0}button,input{font:inherit}[hidden]{display:none!important}
      .boot-page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 440px;align-items:center;gap:clamp(40px,8vw,130px);max-width:1280px;margin:auto;padding:clamp(28px,6vw,88px)}
      .boot-brand{max-width:530px}.boot-identity{display:flex;align-items:center;gap:18px}.boot-mark{width:66px;height:66px;flex:none;display:grid;place-items:center;border-radius:16px;background:#087c91;color:#fff;font-size:25px;font-weight:800;box-shadow:0 12px 28px #087c9130}
      .boot-identity b{display:block;font-size:27px;letter-spacing:-.03em}.boot-identity span{display:block;margin-top:4px;color:#60798a;font-size:14px}
      .boot-kicker{margin:72px 0 16px;color:#087c91;font-size:13px;font-weight:700;letter-spacing:.12em}.boot-brand h2{margin:0;font-size:clamp(32px,3vw,46px);line-height:1.28;letter-spacing:-.04em}.boot-copy{max-width:440px;margin:20px 0 0;color:#60798a;font-size:16px;line-height:1.85}
      .boot-card{padding:42px;background:#fff;border:1px solid #e2ebee;box-shadow:0 24px 72px #16384718;border-radius:18px}.boot-card h1{margin:0 0 8px;font-size:26px;letter-spacing:-.03em}.boot-hint{color:#647d8b;font-size:14px;line-height:1.7}
      .boot-card form{margin-top:30px}.boot-card label{display:block;margin:18px 0 8px;color:#30485a;font-size:14px;font-weight:600}.boot-card input{width:100%;height:46px;padding:10px 13px;border:1px solid #c8d7de;border-radius:8px;outline:none;background:#fff;color:#183142;transition:border-color .15s,box-shadow .15s}
      .boot-card input:focus{border-color:#07849b;box-shadow:0 0 0 3px #07849b20}.boot-card button{width:100%;height:46px;margin-top:28px;border:0;border-radius:8px;background:#087c91;color:#fff;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}.boot-card button:hover{background:#076a7d}.boot-card button:active{transform:translateY(1px)}.boot-card button:disabled{opacity:.7;cursor:wait}
      #boot-status{min-height:22px;margin:14px 0 0;color:#b42318;font-size:13px;line-height:1.6}#boot-status.loading{color:#60798a}#boot-retry{margin:0;background:#edf4f6;color:#087c91}.boot-note{margin:20px 0 0;padding-top:18px;border-top:1px solid #edf1f3;color:#8296a1;font-size:12px}
      .quick-layout{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr);background:#f4f7f9}.quick-sidebar{background:#12293a;color:#d6e5ec}.quick-logo{height:72px;display:flex;align-items:center;gap:12px;padding:14px 18px;color:#fff}.quick-logo-mark{width:40px;height:40px;display:grid;place-items:center;background:#0b7189;font-weight:800}.quick-logo small{display:block;margin-top:2px;color:#9db4c1}.quick-nav{padding:12px}.quick-nav-label{margin:20px 12px 8px;color:#819baa;font-size:12px}.quick-nav button{display:block;width:100%;padding:11px 14px;border:0;border-radius:6px;background:transparent;color:#d6e5ec;text-align:left;cursor:pointer}.quick-nav button:hover,.quick-nav button[aria-current="page"]{background:#21516a;color:#fff}
      .quick-main{min-width:0}.quick-header{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:#fff;border-bottom:1px solid #e4ebef}.quick-user{font-weight:600}.quick-role{margin-left:10px;padding:3px 8px;border-radius:4px;background:#e9f3ff;color:#1677ff;font-size:12px}.quick-logout{border:1px solid #d6e2e8;border-radius:5px;padding:7px 14px;background:#fff;color:#30485a;cursor:pointer}.quick-content{padding:28px}.quick-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.quick-heading h1{margin:0 0 6px;font-size:28px}.quick-heading p{margin:0;color:#6d8391}.quick-range{color:#6d8391;font-size:13px}.quick-error{margin-bottom:16px;padding:12px 16px;border:1px solid #f1c7c2;border-radius:6px;background:#fff4f2;color:#9a271c}.quick-error button{margin-left:12px;border:0;background:transparent;color:inherit;text-decoration:underline;cursor:pointer}.quick-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.quick-layout.publisher .quick-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-card{padding:22px;background:#fff;border:1px solid #dfe8ed;border-radius:6px}.quick-card-label{color:#6d8391;font-size:14px}.quick-card-value{margin-top:12px;font-size:25px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick-panels{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;margin-top:16px}.quick-panel-title{margin:0 0 20px;font-size:16px}.quick-chart{min-height:250px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid #e4ebef}.quick-chart span{flex:1;min-width:2px;background:#a8dbe2;border-radius:3px 3px 0 0}.quick-empty{color:#8296a1;font-size:14px}.quick-top-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf1f3;font-size:13px}.quick-top-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      @media(max-width:850px){.boot-page{grid-template-columns:1fr;gap:32px;max-width:520px;padding:36px 20px}.boot-kicker,.boot-brand h2,.boot-copy{display:none}.boot-card{padding:30px 24px}.boot-identity b{font-size:24px}}
      @media(max-width:850px){.quick-layout{display:block}.quick-sidebar{padding-bottom:6px}.quick-logo{height:56px}.quick-nav{display:flex;overflow-x:auto;gap:6px;padding:0 10px}.quick-nav-label{display:none}.quick-nav button{flex:none;width:auto;white-space:nowrap}.quick-header{height:56px;padding:0 16px}.quick-content{padding:18px 14px}.quick-metrics,.quick-layout.publisher .quick-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-panels{grid-template-columns:1fr}.quick-heading{align-items:start;flex-direction:column}}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-page">
      <section class="boot-brand" aria-label="平台介绍"><div class="boot-identity"><div class="boot-mark">AX</div><div><b id="boot-brand-name">AdX Control</b><span id="boot-brand-hint">平台数据与渠道管理后台</span></div></div><p class="boot-kicker">AD MANAGER · DATA CONSOLE</p><h2>广告业务数据，<br />一处清晰掌握。</h2><p class="boot-copy">管理广告单元、查看多维度报表与渠道收益，快速进入日常工作。</p></section>
      <section class="boot-card" aria-label="登录"><h1 id="boot-title">管理员登录</h1><div class="boot-hint" id="boot-hint">使用平台管理员账号登录。</div>
        <form id="boot-login"><label for="boot-email">登录邮箱</label><input id="boot-email" name="email" type="email" autocomplete="username" required />
          <label for="boot-password">密码</label><input id="boot-password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">登录</button></form><p id="boot-status" role="status" aria-live="polite"></p><button id="boot-retry" type="button" hidden>刷新页面</button><p class="boot-note">仅限授权账号访问</p></section>
    </main><div id="boot-workspace" class="quick-layout" hidden>
      <aside class="quick-sidebar"><div class="quick-logo"><span class="quick-logo-mark">AX</span><div><b id="quick-brand">AdX Control</b><small id="quick-brand-hint">平台管理端</small></div></div><nav class="quick-nav" aria-label="后台导航">
        <button type="button" data-view="dashboard" aria-current="page">经营总览</button><button type="button" data-view="reports">数据报告</button><div class="quick-nav-label" data-admin-only>平台管理</div>
        <button type="button" data-view="channels" data-admin-only>渠道管理</button><button type="button" data-view="gam" data-admin-only>Ad Manager REST</button><button type="button" data-view="settlement" data-admin-only>结算配置</button><button type="button" data-view="ad-units" data-admin-only>广告单元创建</button><button type="button" data-view="admins" data-admin-only>管理员账户</button><button type="button" data-view="report-keys" data-admin-only>账户日报 API Key</button>
        <div class="quick-nav-label">开发能力</div><button type="button" data-view="api">渠道 API</button>
      </nav></aside><div class="quick-main"><header class="quick-header"><div><span id="quick-user" class="quick-user"></span><span id="quick-role" class="quick-role">平台管理员</span></div><button id="quick-logout" class="quick-logout" type="button">退出</button></header>
        <main class="quick-content"><div id="quick-error" class="quick-error" hidden>后台资源连接失败，当前数据仍可查看。<button id="quick-retry" type="button">刷新页面</button></div><div class="quick-heading"><div><h1 id="quick-page-title">经营总览</h1><p id="quick-page-hint">收入、流量质量与渠道结算一屏掌握</p></div><span id="quick-range" class="quick-range"></span></div>
          <div id="quick-page-preview" class="quick-card" hidden>页面正在打开，请稍候。</div><div id="quick-dashboard"><div class="quick-metrics"><div class="quick-card"><div id="quick-revenue-label" class="quick-card-label">总流水（收入）</div><div id="quick-revenue" class="quick-card-value">—</div></div><div class="quick-card" data-admin-only><div class="quick-card-label">渠道结算收益</div><div id="quick-channel-revenue" class="quick-card-value">—</div></div><div class="quick-card"><div class="quick-card-label">展示量</div><div id="quick-impressions" class="quick-card-value">—</div></div><div class="quick-card"><div class="quick-card-label">匹配率</div><div id="quick-match-rate" class="quick-card-value">—</div></div></div>
            <div class="quick-panels"><section class="quick-card"><h2 class="quick-panel-title">每日收益趋势</h2><div id="quick-chart" class="quick-chart"><span class="quick-empty">—</span></div></section><section class="quick-card"><h2 class="quick-panel-title">收益最高的链接</h2><div id="quick-top-urls" class="quick-empty">—</div></section></div></div>
        </main></div></div></div><div id="app-root" hidden></div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
