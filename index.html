<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdX 渠道管理平台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172b3a;background:#eef4f6}
      *{box-sizing:border-box}body{margin:0}.boot-page{min-height:100vh;display:grid;grid-template-columns:minmax(320px,1fr) 480px;gap:9vw;align-items:center;padding:8vw}
      .boot-brand{display:flex;align-items:center;gap:18px;font-size:30px}.boot-brand span{display:block;font-size:14px;color:#6d8391;margin-top:8px}
      .boot-mark{width:72px;height:72px;display:grid;place-items:center;background:#0b7189;color:#fff;font-weight:800}
      .boot-card{padding:32px;background:#fff;box-shadow:0 20px 60px rgba(23,50,77,.13);border-radius:6px}.boot-card h1{margin:0 0 8px;font-size:24px}.boot-hint{color:#6d8391;font-size:14px;line-height:1.6}
      .boot-card form{margin-top:28px}.boot-card label{display:block;margin:16px 0 8px}.boot-card input{width:100%;height:42px;padding:8px 12px;border:1px solid #b8c8d1;border-radius:4px;font:inherit}
      .boot-card button{width:100%;height:42px;margin-top:24px;border:0;border-radius:4px;background:#1677ff;color:#fff;font:inherit;cursor:pointer}.boot-card button:disabled{opacity:.6;cursor:wait}
      #boot-status{min-height:22px;color:#b42318;font-size:14px}#boot-status.loading{color:#587184}
      .boot-page[hidden]{display:none}.boot-shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr;background:#f4f7f9;color:#172b3a}
      .boot-shell aside{background:#12293a;color:#fff;padding:20px 18px}.boot-shell aside strong{display:inline-grid;place-items:center;width:40px;height:40px;margin-right:12px;background:#0b7189}.boot-shell aside p{padding:12px 16px;color:#c4d6e0}
      .boot-shell nav{display:grid;gap:3px;margin-top:28px}.boot-shell nav button{padding:12px 16px;border:0;border-radius:4px;background:none;color:#c4d6e0;text-align:left;font:inherit;cursor:pointer}.boot-shell nav button:hover,.boot-shell nav button.selected{background:#1b4057;color:#fff}
      .boot-shell main header{height:72px;padding:24px 28px;background:#fff;border-bottom:1px solid #e4ebef}.boot-shell main section{margin:24px 28px;padding:32px;background:#fff;border:1px solid #dfe8ed;border-radius:6px}.boot-shell main h1{font-size:20px}.boot-shell main p{color:#587184}
      .boot-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.boot-metrics article{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid #dfe8ed;border-radius:6px}.boot-metrics span{color:#6d8391;font-size:14px}.boot-metrics strong{font-size:24px}.boot-shell h2{font-size:18px}.boot-top-urls{list-style:none;padding:0;margin:0}.boot-top-urls li{display:flex;justify-content:space-between;gap:24px;padding:10px 0;border-bottom:1px solid #e4ebef}.boot-top-urls span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      @media(max-width:850px){.boot-page{display:block;padding:48px 20px}.boot-brand{max-width:480px;margin:0 auto 36px}.boot-card{max-width:480px;margin:auto}}
      @media(max-width:850px){.boot-shell{grid-template-columns:1fr}.boot-shell aside{padding:12px}.boot-shell aside span{display:none}.boot-shell nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px}.boot-shell nav button{flex:none;padding:10px 12px}.boot-shell main section{margin:16px;padding:20px}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-page">
      <div class="boot-brand"><div class="boot-mark">AX</div><div><b id="boot-brand-name">AdX Control</b><span id="boot-brand-hint">平台数据与渠道管理后台</span></div></div>
      <div class="boot-card"><h1 id="boot-title">管理员登录</h1><div class="boot-hint" id="boot-hint">仅限平台管理员访问，渠道账号请前往渠道后台。</div>
        <form id="boot-login"><label for="boot-email">登录邮箱</label><input id="boot-email" name="email" type="email" autocomplete="username" required />
          <label for="boot-password">密码</label><input id="boot-password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">登录</button></form><p id="boot-status" role="status" aria-live="polite"></p></div>
    </div></div>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
